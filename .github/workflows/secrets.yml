name: Secrets

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use secret
        run: echo "Deploying with secrets configured"

      - name: Deploy to Railway
        working-directory: services
        run: npx @railway/cli up --detach --yes --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment production --service solphg-api 2>&1
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
