name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs declare their own permissions. The verify job needs only read access;
# packages:write is granted solely to the job that publishes to GHCR.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Typecheck, test, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install compiler API dependencies
        working-directory: services/compiler
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Typecheck packages
        run: |
          set -euo pipefail
          for pkg in core engine shell plugin-manager integrations; do
            echo "::group::packages/$pkg"
            npx tsc --noEmit -p "packages/$pkg/tsconfig.json"
            echo "::endgroup::"
          done
          echo "::group::apps/playground"
          npx tsc --noEmit -p apps/playground/tsconfig.json
          echo "::endgroup::"

      - name: Typecheck compiler API
        working-directory: services/compiler
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit compiler API dependencies
        working-directory: services/compiler
        run: npm audit --audit-level=high

  builder-image:
    name: Builder image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lowercase image owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep `load: true` so the smoke tests can use the local `solphg-builder:ci`
      # tag. buildx pushes every tag when `push: true`, which would try to push
      # that local-only tag to Docker Hub. Publish explicitly below instead.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services
          file: services/builder.Dockerfile
          load: true
          tags: |
            solphg-builder:ci
            ghcr.io/${{ steps.repo.outputs.owner }}/solphg-builder:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/solphg-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (non-root, toolchain, canonical lock)
        run: |
          set -euo pipefail
          echo "anchor: $(docker run --rm solphg-builder:ci anchor --version)"
          echo "solana: $(docker run --rm solphg-builder:ci solana --version)"
          echo "rust:   $(docker run --rm solphg-builder:ci rustc --version)"
          uid="$(docker run --rm solphg-builder:ci id -u)"
          test "$uid" = "10001" || { echo "expected uid 10001, got $uid"; exit 1; }
          test "$(docker run --rm solphg-builder:ci whoami)" = "solbuilder"
          docker run --rm solphg-builder:ci test -f /usr/local/cargo/canonical-anchor.lock
          docker run --rm solphg-builder:ci test -d /usr/local/share/solana-cache/solana
          docker run --rm solphg-builder:ci test -w /workspaces
          docker run --rm solphg-builder:ci test -w /workspaces/build

      - name: Extract canonical Cargo lockfile
        run: |
          set -euo pipefail
          container="$(docker create solphg-builder:ci)"
          docker cp "$container:/usr/local/cargo/canonical-anchor.lock" ./canonical-anchor.lock
          docker rm "$container"
          test -s ./canonical-anchor.lock

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file ./canonical-anchor.lock

      - name: Push verified image to GHCR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ steps.repo.outputs.owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "ghcr.io/$OWNER/solphg-builder:latest"
          docker push "ghcr.io/$OWNER/solphg-builder:$SHA"

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      # GitHub-hosted ubuntu runners have a running Docker daemon. The script
      # builds both images via services/docker-compose.yml, builds the counter
      # and SPL templates through /api/build, checks the ELF/IDL artifacts and
      # asserts a repeat build is a cache hit. It tears the stack down in
      # `finally`, including on failure.
      - name: Build counter and SPL templates in the API container
        run: npm run test:integration:api

  playground-smoke:
    name: Playground smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build playground SPA
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Serves dist/ locally and stubs /api/* in the browser, so this tests the
      # SPA wiring (launch -> build -> success/IDL -> cached rebuild) without a
      # live API, RPC, wallet or network dependency.
      - name: Smoke test the playground UI flow
        run: npm run test:smoke:playground

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    needs: [verify, builder-image, api-integration, playground-smoke]
    steps:
      - name: Require all quality jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > needs.json
          failed=0
          for job in verify builder-image api-integration playground-smoke; do
            result="$(jq -r --arg j "$job" '.[$j].result // "missing"' needs.json)"
            echo "$job: $result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then failed=1; fi
          done
          exit "$failed"
