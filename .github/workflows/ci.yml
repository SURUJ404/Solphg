name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the builder image job only needs packages:write on main.
permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Typecheck, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install compiler API dependencies
        working-directory: services/compiler
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Typecheck packages
        run: |
          set -euo pipefail
          for pkg in core engine shell plugin-manager integrations; do
            echo "::group::packages/$pkg"
            npx tsc --noEmit -p "packages/$pkg/tsconfig.json"
            echo "::endgroup::"
          done
          echo "::group::apps/playground"
          npx tsc --noEmit -p apps/playground/tsconfig.json
          echo "::endgroup::"

      - name: Typecheck compiler API
        working-directory: services/compiler
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit compiler API dependencies
        working-directory: services/compiler
        run: npm audit --audit-level=high

  builder-image:
    name: Builder image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lowercase image owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services
          file: services/builder.Dockerfile
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            solphg-builder:ci
            ghcr.io/${{ steps.repo.outputs.owner }}/solphg-builder:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/solphg-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (non-root, toolchain, canonical lock)
        run: |
          set -euo pipefail
          echo "anchor: $(docker run --rm solphg-builder:ci anchor --version)"
          echo "solana: $(docker run --rm solphg-builder:ci solana --version)"
          echo "rust:   $(docker run --rm solphg-builder:ci rustc --version)"
          uid="$(docker run --rm solphg-builder:ci id -u)"
          test "$uid" = "10001" || { echo "expected uid 10001, got $uid"; exit 1; }
          test "$(docker run --rm solphg-builder:ci whoami)" = "solbuilder"
          docker run --rm solphg-builder:ci test -f /usr/local/cargo/canonical-anchor.lock
          docker run --rm solphg-builder:ci test -d /usr/local/share/solana-cache/solana
          docker run --rm solphg-builder:ci test -w /workspaces
