name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install compiler API dependencies
        working-directory: services/compiler
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      - name: Package frontend
        run: |
          set -euo pipefail
          cd apps/playground/dist
          zip -r "$GITHUB_WORKSPACE/playground.zip" .

      - name: Package compiler API
        run: |
          set -euo pipefail
          cd services/compiler/dist
          zip -r "$GITHUB_WORKSPACE/compiler-api.zip" .

      - name: Create release with generated changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Solphg $GITHUB_REF_NAME" \
            --generate-notes \
            playground.zip compiler-api.zip

      - name: Rollback instructions
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Rollback
          - Frontend: promote the previous Vercel deployment (Vercel → Deployments → Promote).
          - API image: redeploy the previous immutable tag
            `ghcr.io/<owner>/solphg-builder:<previous-sha>` with
            `railway redeploy --service solphg-api`.
          - Cache: bump `TOOLCHAIN_TAG` and clear `/var/lib/solphg/cache`.
          See docs/RUNBOOK.md.
          EOF
